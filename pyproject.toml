[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mwig-replication"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "seaborn", "statsmodels", "plotly", "requests", "pdfplumber", "pyarrow", "nbformat", "beautifulsoup4"]

[tool.setuptools.packages.find]
where = ["src"]
